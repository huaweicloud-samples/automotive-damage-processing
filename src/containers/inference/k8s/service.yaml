# inference Service：通过注解挂载 Terraform 创建的独享型 ELB（internet-facing）
# 经独享型 ELB 对外暴露推理 UI（公网 HTTP:80 -> 容器 8501）
apiVersion: v1
kind: Service
metadata:
  name: damage-inference
  namespace: default
  annotations:
    # 由 infra/elb.tf 创建的独享型 ELB ID（L7 flavor，apply 前替换为真实值）
    kubernetes.io/elb.id: "6923434a-99f4-4cf4-a2a7-c5b45ec84c9f"
    kubernetes.io/elb.class: "performance"
    kubernetes.io/elb.port: "80"
    # L7 flavor 的 ELB 只能建 HTTP(S) 监听器（L4 会报 ELB.8907），必须显式声明协议（格式 协议:端口）
    kubernetes.io/elb.protocol-port: "HTTP:80"
    kubernetes.io/elb.lb-algorithm: "ROUND_ROBIN"
spec:
  type: LoadBalancer
  selector:
    app: damage-inference
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8501
