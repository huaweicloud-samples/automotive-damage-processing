# 凭据 Secret（AK/SK 与 CSS 口令，运行期注入容器）。
# 注意：以下为占位符，禁止提交真实值。请用以下命令创建真实 Secret：
#   kubectl create secret generic damage-secret \
#     --from-literal=HW_ACCESS_KEY=<AK> \
#     --from-literal=HW_SECRET_KEY=<SK> \
#     --from-literal=MAAS_API_KEY=<MaaS-API-KEY> \
#     --from-literal=OS_USER=admin \
#     --from-literal=OS_PASSWORD=<css-password>
# 也可在 deployment-guide.md 中查看说明。
apiVersion: v1
kind: Secret
metadata:
  name: damage-secret
  namespace: default
type: Opaque
stringData:
  HW_ACCESS_KEY: "<HW_ACCESS_KEY>"
  HW_SECRET_KEY: "<HW_SECRET_KEY>"
  MAAS_API_KEY: "<MAAS_API_KEY>"
  OS_USER: "admin"
  OS_PASSWORD: "<OS_PASSWORD>"
